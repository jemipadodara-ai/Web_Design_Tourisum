<!DOCTYPE html>
<html lang="en">
<head>
    <title>Incredible India | Gallery</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #ff9966,white, #66ff99);
            color: #333333;
        }

        .main-header {
            background: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .navbar a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            transition: color 0.3s;
        }

        .navbar a:hover {
            color: #ff9933;
        }

        
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .intro-text {
            text-align: center;
            margin-bottom: 30px;
        }

        .intro-text h2 {
            font-size: 20px;
            color: #000080;
            margin-bottom: 10px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; 
            gap: 30px;
        }

        .gallery-item {
            width: calc(33.33% - 25px);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px); 
            box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.5);
        }

        .gallery-item img {
            border-radius: 12px;
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .main-footer {
            background: #333333;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
        
        @media screen and (max-width: 900px) {
          .gallery-item {
            width: calc(50% - 20px);
          }
        }

        @media screen and (max-width: 600px) {
        .navbar {
          flex-wrap: wrap;
          gap: 8px;
          justify-content: center;
          line-height: 2;
        }

        .navbar a {
          font-size: 14px;
        }

        .gallery-item {
          width: 100%;
        }
      }
    </style>
</head>
<body>

    <header class="main-header">
        <h1>Gallery</h1>
        <nav class="navbar">
            <a href="index.html">Home</a> | 
            <a href="places.html">Places</a> | 
            <a href="info.html">Info</a> | 
            <a href="contact.html">Contact</a> | 
            <a href="about.html">About</a> | 
            <a href="gallery.html">Gallery</a>
        </nav>
    </header>

    <main class="container">
        <section class="intro-text">
            <h2>Gallery of Incredible India</h2>
            <p>Explore the breathtaking beauty and cultural richness of India through our curated gallery.</p>
        </section>

        <div class="gallery">
            <div class="gallery-item"><img src="./gallery/jammu_kashmir1.webp" alt="Jammu Kashmir"></div>
            <div class="gallery-item"><img src="./gallery/rajasthan1.webp" alt="Rajasthan"></div>
            <div class="gallery-item"><img src="./gallery/assam1.avif" alt="Assam"></div>
            <div class="gallery-item"><img src="./gallery/tamilnadu1.webp" alt="Tamil Nadu"></div>
            <div class="gallery-item"><img src="./gallery/maharastra1.avif" alt="Maharashtra"></div>
            <div class="gallery-item"><img src="./gallery/uttarakhand1.webp" alt="Uttrakhand"></div>
            <div class="gallery-item"><img src="./gallery/jammu_kashmir2.jpg" alt="Jammu Kashmir"></div>
            <div class="gallery-item"><img src="./gallery/rajasthan2.webp" alt="Rajasthan"></div>
            <div class="gallery-item"><img src="./gallery/assam2.webp" alt="Assam"></div>
            <div class="gallery-item"><img src="./gallery/tamilnadu2.jpg" alt="Tamil Nadu"></div>
            <div class="gallery-item"><img src="./gallery/maharastra2.webp" alt="Maharashtra"></div>
            <div class="gallery-item"><img src="./gallery/uttarakhand2.jpg" alt="Uttrakhand"></div>
            <div class="gallery-item"><img src="./gallery/srinagar.png" alt="Srinagar"></div>
            <div class="gallery-item"><img src="./gallery/home_kashmir.jpeg" alt="Kashmir"></div>
            <div class="gallery-item"><img src="./gallery/home_maharastraa.webp" alt="Maharashtra"></div>
        </div>
    </main>

    <footer class="main-footer">
        <p>© 2026 Incredible India. All rights reserved.</p>
    </footer>

</body>
</html>
